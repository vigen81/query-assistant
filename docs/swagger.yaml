        type: string
      estimated_rows:
        description: New fields
        example: 10000
        type: integer
      operations:
        items:
          type: string
        type: array
      optimizations:
        items:
          type: string
        type: array
      tables:
        items:
          type: string
        type: array
      valid:
        type: boolean
      warnings:
        items:
          type: string
        type: array
    type: object
  models.SchemaInfo:
    properties:
      database:
