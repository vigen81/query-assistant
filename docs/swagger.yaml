      service:
        example: query-assistant
        type: string
      status:
        example: ok
        type: string
      timestamp:
        example: "2023-01-01T00:00:00Z"
        type: string
      version:
        example: 1.0.0
        type: string
    type: object
  models.PaginationInfo:
    properties:
      has_next:
        example: true
        type: boolean
      has_previous:
        example: false
        type: boolean
      next_page:
        example: 2
        type: integer
      page:
        example: 1
        type: integer
      page_size:
        example: 100
        type: integer
      previous_page:
        type: integer
      total_pages:
        example: 10
        type: integer
      total_rows:
        example: 1000
        type: integer
