  models.QueryRequest:
    properties:
      context:
        type: object
      include_schema:
        description: Response options
        example: true
        type: boolean
      include_stats:
        example: true
        type: boolean
      page:
        description: Pagination options
        example: 1
        minimum: 1
        type: integer
      page_size:
        example: 100
        maximum: 10000
        minimum: 1
        type: integer
      prompt:
        example: Show me the top 10 users by total purchase amount in the last 30
