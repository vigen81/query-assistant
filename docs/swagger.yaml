host: dev.smartbet.live
info:
  contact:
    email: support@yourcompany.com
    name: API Support
  description: |-
    An intelligent query assistant that uses ChatGPT to generate and execute ClickHouse queries based on natural language prompts with multi-tenant support.

    ## Features
    - **Natural Language Processing**: Convert plain English prompts to ClickHouse SQL queries
    - **Multi-Tenant Support**: All queries are filtered by site_id for data isolation
    - **Schema-Aware**: Understands your database schema for accurate query generation
    - **Business Logic**: Built-in understanding of gaming metrics (GGR = Bet - Win)
    - **Query Execution**: Automatically executes generated queries with timeout protection
    - **Secure**: Query validation, site_id enforcement, and execution limits
    - **Observable**: Structured logging with Graylog integration
    - **Banner Generation**: Async AI-powered marketing banner image generation via DALL-E 3

    ## Important Business Rules
    - **GGR Calculation**: Gross Gaming Revenue is always calculated as Total Bet - Total Win
    - **Site Isolation**: All queries are automatically filtered by site_id
    - **Archive Tables**: Queries on archive tables always include created_at filters
    - **RMT Tables**: Tables with 'rmt' in name use FINAL keyword for consistency

    ## Multi-Tenant Architecture
    All API endpoints require a numeric site_id parameter to ensure data isolation between different sites/tenants.
    The system automatically adds WHERE site_id = {your_site_id} to all generated queries.

    ## Authentication
    Most endpoints require a Bearer token in the Authorization header:
    Authorization: Bearer {your-jwt-token}

    ## Banner Image Generation
    Banner generation is asynchronous. POST to /api/v1/banner/generate to start a job,
    then poll GET /api/v1/banner/generate/{id} until status is "completed" or "failed".
    Default variant count is 4 images per request (configurable via banner.variant_count in config).
  termsOfService: http://swagger.io/terms/
  title: Query Assistant API
  version: "1.0"
paths:
  /banner/generate:
    post:
      consumes:
      - application/json
      description: Accepts a banner generation request and returns a generation ID
        immediately.
      parameters:
      - description: Generation parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.BannerGenerationRequest'
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/models.BannerGenerationAccepted'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Start async banner image generation
      tags:
      - banner
  /banner/generate/{id}:
    get:
      description: Returns status, variants (URLs / b64) and failure info for a generation
        job.
      parameters:
      - description: Generation ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BannerGenerationResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get banner generation status
      tags:
      - banner
  /health:
    get:
      description: Returns the general health status of the query assistant service
      produces:
      - application/json
      responses:
        "200":
          description: Service is healthy
          schema:
            $ref: '#/definitions/models.HealthResponse'
      summary: Health check
      tags:
      - health
  /live:
    get:
      description: Returns the liveness status of the query assistant
      produces:
      - application/json
      responses:
        "200":
          description: Service is alive
          schema:
            $ref: '#/definitions/models.HealthResponse'
      summary: Liveness check
      tags:
      - health
  /query/execute:
    post:
      consumes:
      - application/json
      description: Convert a natural language prompt to SQL and execute it against
        ClickHouse with site_id filtering for multi-tenancy
      parameters:
      - description: Query request with required site_id for multi-tenant filtering
        in: body
        name: query
        required: true
        schema:
          $ref: '#/definitions/models.QueryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successful query execution with results filtered by site_id
          schema:
            $ref: '#/definitions/models.QueryResponse'
        "400":
          description: Invalid request - missing site_id or invalid format
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized - invalid or missing token
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "408":
          description: Query timeout
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Execute a natural language query with site filtering
      tags:
      - query
  /query/generate:
    post:
      consumes:
      - application/json
      description: Generate a SQL query from natural language prompt without executing
        it
      parameters:
      - description: Generation request with site_id
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.QueryGenerateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Generated SQL query with metadata
          schema:
            $ref: '#/definitions/models.QueryGenerateResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Generate SQL query
      tags:
      - query
  /query/history:
    get:
      description: Retrieve the history of previously executed queries with pagination
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 50
        description: Page size
        in: query
        name: page_size
        type: integer
      - description: Filter by user ID
        in: query
        name: user_id
        type: string
      - description: Filter by site ID
        in: query
        name: site_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of historical queries
          schema:
            items:
              $ref: '#/definitions/models.QueryHistory'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get query history
      tags:
      - query
  /query/validate:
    post:
      consumes:
      - application/json
      description: Validate a SQL query for syntax and security without executing
        it, with optimization suggestions
      parameters:
      - description: Query to validate with site_id
        in: body
        name: query
        required: true
        schema:
          $ref: '#/definitions/models.QueryValidateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Validation result with warnings and optimization suggestions
          schema:
            $ref: '#/definitions/models.QueryValidationResult'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Validate a SQL query
      tags:
      - query
  /ready:
    get:
      description: Returns the readiness status of the query assistant including dependency
        checks
      produces:
      - application/json
      responses:
        "200":
          description: Service is ready to accept requests
          schema:
            $ref: '#/definitions/models.HealthResponse'
        "503":
          description: Service is not ready - dependencies not available
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Readiness check
      tags:
      - health
  /schema:
    get:
      description: Get the complete database schema including all tables and columns
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SchemaInfo'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get database schema
      tags:
      - schema
  /schema/refresh:
    post:
      description: Manually refresh the database schema cache
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Refresh schema cache
      tags:
      - schema
  /schema/table/{table}:
    get:
      description: Get schema information for a specific table
      parameters:
      - description: Table name
        in: path
        name: table
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.TableSchema'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get table schema
      tags:
      - schema
swagger: "2.0"
tags:
- description: Query generation and execution operations with multi-tenant support
  name: query
- description: Database schema information
  name: schema
- description: Health and readiness checks
  name: health
- description: Async AI banner image generation via DALL-E 3. POST to start, GET to
    poll status.
  name: banner
