        type: array
      description:
        example: User information table
        type: string
      engine:
        example: MergeTree
        type: string
      last_modified:
        type: string
      name:
        example: users
        type: string
      partition_key:
        description: New fields
        example: toYYYYMM(created_at)
        type: string
      row_count:
        example: 1000000
        type: integer
      size_bytes:
        example: 104857600
        type: integer
      sorting_key:
