        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: |-
    An intelligent query assistant that uses ChatGPT to generate and execute ClickHouse queries based on natural language prompts.

    ## Features
    - **Natural Language Processing**: Convert plain English prompts to ClickHouse SQL queries
    - **Schema-Aware**: Understands your database schema for accurate query generation
    - **Query Execution**: Automatically executes generated queries with timeout protection
    - **Secure**: Query validation and execution limits
    - **Observable**: Structured logging with Graylog integration

    ## How it works
    1. User submits a natural language prompt about their data
    2. System sends the prompt along with schema information to ChatGPT
    3. ChatGPT generates an appropriate ClickHouse query
    4. System validates and executes the query with timeout protection
    5. Results are formatted and returned to the user
  termsOfService: http://swagger.io/terms/
  title: Query Assistant API
  version: "1.0"
paths:
  /health:
    get:
      description: Returns the general health status of the query assistant service
      produces:
      - application/json
      responses:
        "200":
          description: Service is healthy
          schema:
            $ref: '#/definitions/models.HealthResponse'
      summary: Health check
      tags:
      - health
  /live:
    get:
      description: Returns the liveness status of the query assistant
      produces:
      - application/json
      responses:
        "200":
          description: Service is alive
          schema:
            $ref: '#/definitions/models.HealthResponse'
      summary: Liveness check
      tags:
      - health
  /query/execute:
    post:
      consumes:
      - application/json
      description: Convert a natural language prompt to SQL and execute it against
        ClickHouse with optional pagination and column metadata
      parameters:
      - description: Query request with optional pagination
        in: body
        name: query
        required: true
        schema:
          $ref: '#/definitions/models.QueryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successful query execution with results, column metadata, and
            pagination info
          schema:
            $ref: '#/definitions/models.QueryResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "408":
          description: Query timeout
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Execute a natural language query
      tags:
      - query
  /query/generate:
    post:
      consumes:
      - application/json
      description: Generate a SQL query from natural language prompt without executing
        it
      parameters:
      - description: Generation request
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Generated SQL query with metadata
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Generate SQL query
      tags:
      - query
  /query/history:
    get:
      description: Retrieve the history of previously executed queries with pagination
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 50
        description: Page size
        in: query
        name: page_size
        type: integer
      - description: Filter by user ID
        in: query
        name: user_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of historical queries
          schema:
            items:
              $ref: '#/definitions/models.QueryHistory'
            type: array
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get query history
      tags:
      - query
  /query/validate:
    post:
      consumes:
      - application/json
      description: Validate a SQL query for syntax and security without executing
        it, with optimization suggestions
      parameters:
      - description: Query to validate
        in: body
        name: query
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Validation result with warnings and optimization suggestions
          schema:
            $ref: '#/definitions/models.QueryValidationResult'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Validate a SQL query
      tags:
      - query
  /ready:
    get:
      description: Returns the readiness status of the query assistant including dependency
        checks
      produces:
      - application/json
      responses:
        "200":
          description: Service is ready to accept requests
          schema:
            $ref: '#/definitions/models.HealthResponse'
        "503":
          description: Service is not ready - dependencies not available
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Readiness check
      tags:
      - health
  /schema:
    get:
      description: Get the complete database schema including all tables and columns
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SchemaInfo'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get database schema
      tags:
      - schema
  /schema/refresh:
    post:
      description: Manually refresh the database schema cache
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Refresh schema cache
      tags:
      - schema
  /schema/table/{table}:
    get:
      description: Get schema information for a specific table
      parameters:
      - description: Table name
        in: path
        name: table
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.TableSchema'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get table schema
      tags:
      - schema
swagger: "2.0"
tags:
- description: Query generation and execution operations
  name: query
- description: Database schema information
  name: schema
- description: Health and readiness checks
  name: health
